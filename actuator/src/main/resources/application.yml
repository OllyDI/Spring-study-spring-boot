spring:
  application:
    name: hello-actuator

management:
  info:
    java:
      enabled: true
    os:
      enabled: true
    env:
      enabled: true
#  server:
#    port: 9292
  endpoint:
    shutdown:
      enabled: true
    health:
#      show-details: always
      show-components: always
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: "*"

# 만들기도 가능
info:
  app:
    name: hello-actuator
    company: ch

# 로깅 레벨 변환
logging:
  level:
    hello.controller: debug

server:
  tomcat:
    mbeanregistry:
      enabled: true